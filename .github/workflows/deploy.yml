name: Deploy

# Deploys main to Azure App Service after CI passes (ADR 0010). Infrastructure lives in infra/main.bicep.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, never cancelled half-way through a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  deploy:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish the API with the web app in wwwroot
        run: |
          dotnet publish src/SixStack.Api -c Release -o publish
          mkdir -p publish/wwwroot
          cp -r frontend/dist/sixstack/browser/. publish/wwwroot/

      - name: Build the database CLI
        run: dotnet publish src/SixStack.Cli -c Release -o cli

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Open the SQL firewall to this runner
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          echo "RUNNER_RULE=gh-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          az sql server firewall-rule create -g "${{ vars.AZURE_RESOURCE_GROUP }}" -s "${{ vars.AZURE_SQL_SERVER }}" \
            -n "gh-${{ github.run_id }}-${{ github.run_attempt }}" --start-ip-address "$ip" --end-ip-address "$ip" -o none

      - name: Migrate the database
        run: dotnet cli/SixStack.Cli.dll migrate
        env:
          ConnectionStrings__Default: ${{ secrets.SQL_CONNECTION_STRING }}

      - name: Close the SQL firewall
        if: always() && env.RUNNER_RULE != ''
        run: az sql server firewall-rule delete -g "${{ vars.AZURE_RESOURCE_GROUP }}" -s "${{ vars.AZURE_SQL_SERVER }}" -n "$RUNNER_RULE"

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Smoke test
        run: |
          base="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for i in $(seq 1 30); do
            if curl -fsS "$base/health/ready" | grep -q Healthy; then break; fi
            sleep 10
          done
          curl -fsS "$base/health/ready" | grep -q Healthy
          curl -fsS "$base/" | grep -qi "<html"
          curl -fsS "$base/events" | grep -qi "<html"
