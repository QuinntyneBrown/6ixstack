<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" [routerLink]="homePath()" aria-label="6ixstack home">
      <!-- Official Magic Patterns logo mark: docs/assets/6ixstack-mark.svg (L2-104). -->
      <svg class="brand__mark" aria-hidden="true" focusable="false" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="8" fill="#111318" />
        <path
          d="M19.75 7.25C14 8 10.5 12.5 10.5 19.5"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="3.25"
          stroke-linecap="round"
        />
        <circle cx="16" cy="19.5" r="5.5" fill="none" stroke="#FFFFFF" stroke-width="3.25" />
        <circle cx="16" cy="19.5" r="1.9" fill="#FF5A1F" />
      </svg>
      <span aria-hidden="true"
        ><span class="brand__six">6ix</span><span class="brand__stack">stack</span></span
      >
    </a>
    <nav class="site-header__nav" aria-label="Primary">
      @for (item of items(); track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="nav-link--active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          ariaCurrentWhenActive="page"
          >{{ item.label }}</a
        >
      }
    </nav>
    <div class="site-header__actions">
      <ng-content select="[slot=actions]" />
      @if (showSubmit()) {
        <a
          sx-button
          appearance="primary"
          [routerLink]="submitDisabled() ? null : submitPath()"
          [attr.aria-disabled]="submitDisabled() ? 'true' : null"
          [attr.role]="submitDisabled() ? 'link' : null"
          [attr.tabindex]="submitDisabled() ? 0 : null"
          aria-label="Submit event"
        >
          <sx-icon name="plus" /><span class="site-header__submit-label">Submit event</span>
        </a>
      }
      <button
        sx-button
        appearance="ghost"
        iconOnly
        type="button"
        class="site-header__menu"
        aria-label="Open menu"
        aria-haspopup="dialog"
        [attr.aria-expanded]="menuExpanded()"
        (click)="menuRequested.emit($any($event.currentTarget))"
      >
        <sx-icon name="menu" />
      </button>
    </div>
  </div>
</header>
